name: CI with Security Checks

on: [push, pull_request]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install safety bandit pip-audit

      - name: Run Tests
        run: pytest tests/ -v

      - name: Security Check 1 - Dependency Scan
        run: |
          echo " Checking for vulnerable dependencies..."
          safety check -r requirements.txt
        continue-on-error: true

      - name: Security Check 2 - Code Security Scan
        run: |
          echo " Scanning code for security issues..."
          bandit -r src/ -ll
        continue-on-error: true

      - name: Security Check 3 - Dependency Audit (gate)
        run: |
          echo " Auditing requirements.txt against the PyPI advisory database..."
          pip-audit -r requirements.txt --desc
